function exportAlertCSV(rows,name){doExportCSV(rows,'ATP_Alert_'+name+'_'+new Date().toISOString().slice(0,10)+'.csv',CSV_COLS);}
function buildMs(tab,key,label,opts,selSet){var id='ms-'+key+'-'+tab;var cnt=selSet instanceof Set?selSet.size:0;var lbl=cnt===0?'All '+label:cnt+' selected';var allChk=(selSet instanceof Set&&selSet.size===opts.length)?"checked":"";var selAll='<label class="ms-item" style="border-bottom:1px solid #e2e8f0;font-weight:700" onclick="event.stopPropagation()"><input type="checkbox" '+allChk+' onchange="toggleSelectAll(event,\'+tab+\',\'+key+\',this.checked)"> <span>Select All</span></label>';var items=opts.map(v=>{var chk=selSet instanceof Set&&selSet.has(v)?'checked':'';var safe=v.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');return'<label class="ms-item" onclick="event.stopPropagation()"><input type="checkbox" '+chk+' onchange="toggleFilter(\''+tab+'\',\''+key+'\',\''+safe+'\',this.checked)"> <span>'+v+'</span></label>';}).join('');return'<div class="ms-wrap" id="'+id+'" onclick="event.stopPropagation()">'+'<div class="ms-toggle" onclick="toggleMs(\''+id+'\',event)"><span class="ms-lbl">'+lbl+'</span><span class="ms-arrow">▾</span></div>'+'<div class="ms-dropdown" id="'+id+'-dd" style="display:none;flex-direction:column">'+'<div class="ms-search"><input type="text" placeholder="Search..." oninput="filterMsList(\''+id+'-dd\',this.value)" onclick="event.stopPropagation()"></div>'+'<div class="ms-list">'+selAll+items+'</div>'+'</div>'+'</div>';}
function buildFilters(tab,data,filters){var verts=uniq(data,'vertical'),scats=uniq(data,'supercat'),brands=uniq(data,'brand'),atps=uniq(data,'atp_avail');var flags=[...new Set(data.flatMap(r=>r.flag?r.flag.split(','):[]).filter(Boolean))].sort();return'<div class="filter-bar">'+'<div class="filter-group"><label>Vertical</label>'+buildMs(tab,'vertical','Verticals',verts,filters.vertical)+'</div>'+'<div class="filter-group"><label>Super Category</label>'+buildMs(tab,'supercat','Categories',scats,filters.supercat)+'</div>'+'<div class="filter-group"><label>Brand</label>'+buildMs(tab,'brand','Brands',brands,filters.brand)+'</div>'+'<div class="filter-group"><label>ATP Type</label>'+buildMs(tab,'atp_avail','ATP Types',atps,filters.atp_avail)+'</div>'+'<div class="filter-group"><label>Flag</label>'+buildMs(tab,'flag','Flags',flags,filters.flag)+'</div>'+'<div class="filter-group"><label>Search FSN</label><input type="text" class="fsn-search" placeholder="FSN..." value="'+(filters.fsn||'')+'" oninput="setFsnFilter(\''+tab+'\',this.value)"></div>'+'<div style="display:flex;gap:6px;align-items:flex-end">'+'<button class="btn-reset" onclick="resetFilters(\''+tab+'\')">↺ Reset</button>'+'<button class="btn-export" onclick="exportCSV(\''+tab+'\')">⬇ CSV</button>'+'</div>'+'</div>';}
const ALERT_COLS=[{h:'FSN',fn:r=>'<span class="fsn-cell">'+r.fsn+'</span>'},{h:'FSN | Store Combos',fn:r=>'<span class="combo-cell" title="'+fsnStoreCombos(r)+'">'+fsnStoreCombos(r)+'</span>'},{h:'Brand',fn:r=>'<b>'+r.brand+'</b>'},{h:'Vertical',fn:r=>r.vertical},{h:'ATP',fn:r=>atpBadge(r.atp_avail)},{h:'SH ATP',fn:r=>'<span class="atp-sh">'+fmt(r.sh_atp)+'</span>'},{h:'DS ATP',fn:r=>'<span class="atp-ds">'+fmt(r.ds_atp)+'</span>'},{h:'Total ATP',fn:r=>'<span class="atp-total">'+fmt(r.total_atp)+'</span>'},{h:'DRR',fn:r=>drrCell(r.drr)},{h:'DOH',fn:r=>dohCell(r.doh)},{h:'L30 FK',fn:r=>fmt(r.l30_fk)},{h:'L30 HL',fn:r=>fmt(r.l30_hl)},{h:'Product',fn:r=>'<span title="'+r.title+'">'+r.title.substring(0,35)+'…</span>'}];
const GSLI_COLS=[{h:'FSN',fn:r=>'<span class="fsn-cell">'+r.fsn+'</span>'},{h:'FSN | Store Combos',fn:r=>'<span class="combo-cell" title="'+fsnStoreCombos(r)+'">'+fsnStoreCombos(r)+'</span>'},{h:'Brand',fn:r=>'<b>'+r.brand+'</b>'},{h:'Super Cat',fn:r=>r.supercat},{h:'ATP',fn:r=>atpBadge(r.atp_avail)},{h:'Total ATP',fn:r=>'<span class="atp-total">'+fmt(r.total_atp)+'</span>'},{h:'DRR',fn:r=>drrCell(r.drr)},{h:'DOH',fn:r=>dohCell(r.doh)},{h:'L30 FK',fn:r=>'<b style="color:#059669">'+fmt(r.l30_fk)+'</b>'},{h:'L30 HL',fn:r=>'<b style="color:#0891b2">'+fmt(r.l30_hl)+'</b>'},{h:'SH ATP',fn:r=>'<span class="atp-sh">'+fmt(r.sh_atp)+'</span>'},{h:'DS ATP',fn:r=>'<span class="atp-ds">'+fmt(r.ds_atp)+'</span>'},{h:'Product',fn:r=>'<span title="'+r.title+'">'+r.title.substring(0,30)+'…</span>'}];
function miniSubtotal(rows,cols){return'<tr class="mini-subtotal"><td colspan="'+cols.length+'" style="padding:6px 9px;font-size:10px">'+'SUBTOTAL ('+rows.length+' FSNs) &nbsp;| '+'SH ATP: <b>'+fmt(rows.reduce((s,r)=>s+r.sh_atp,0))+'</b> &nbsp;| '+'DS ATP: <b>'+fmt(rows.reduce((s,r)=>s+r.ds_atp,0))+'</b> &nbsp;| '+'Total ATP: <b>'+fmt(rows.reduce((s,r)=>s+r.total_atp,0))+'</b> &nbsp;| '+'L30 FK: <b>'+fmt(rows.reduce((s,r)=>s+r.l30_fk,0))+'</b> &nbsp;| '+'L30 HL: <b>'+fmt(rows.reduce((s,r)=>s+r.l30_hl,0))+'</b>'+'</td></tr>';}
function buildAlertTable(rows,cols){if(!rows.length)return'<div style="color:#64748b;padding:16px;text-align:center;font-style:italic;font-size:11px">No items at this threshold.</div>';return'<div style="overflow-x:auto"><table class="mini-tbl">'+'<thead><tr>'+cols.map(c=>'<th>'+c.h+'</th>').join('')+'</tr></thead>'+'<tbody>'+miniSubtotal(rows,cols)+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+c.fn(r)+'</td>').join('')+'</tr>').join('')+'</tbody>'+'</table></div>';}
function buildAlerts(tab,stats){
  var noDsAll=stats.noDsHighDrr.sort((a,b)=>b.drr-a.drr);var noDsTop=noDsAll.slice(0,200);
  var noShAll=stats.noShHighDrr.sort((a,b)=>b.drr-a.drr);var noShTop=noShAll.slice(0,200);
  var lowDohAll=stats.lowDoh.sort((a,b)=>a.doh-b.doh);var lowDoh=lowDohAll.slice(0,200);
  var critAll=stats.critStock.sort((a,b)=>a.doh-b.doh);var crit=critAll.slice(0,200);
  var gsliAll=stats.goodSalesLowInv.sort((a,b)=>(b.l30_fk+b.l30_hl)-(a.l30_fk+a.l30_hl));var gsli=gsliAll.slice(0,200);
  if(!window.ADAT)window.ADAT={};window.ADAT[tab+'_NoDS_ATP']=noDsTop;window.ADAT[tab+'_NoSH_ATP']=noShTop;window.ADAT[tab+'_Low_DOH']=lowDoh;window.ADAT[tab+'_Critical_Stock']=crit;window.ADAT[tab+'_Good_Sales_Low_Stock']=gsli;
  function apanel(id,title,rows,total,cols,badgeCls,csvName){return'<div id="'+id+'" class="alert-panel">'+'<div class="section-head"><h3>'+title+'</h3>'+'<div class="section-head-right">'+'<span class="cnt-badge '+badgeCls+'">'+total+' FSNs</span>'+'<button class="btn-export-sm" onclick="exportAlertCSV(window.ADAT['+tab+'_'+csvName+'],'+csvName+')">⬇ CSV</button>'+'</div></div>'+buildAlertTable(rows,cols)+'</div>';}
  return'<div class="alerts">'+'<div class="alert-header"><h2>🚨 Pro Insights — Action Required</h2></div>'+'<div class="alert-tabs">'+'<div class="alert-tab active" onclick="switchAlert(this,\'aNoDs-'+tab+'\')">❌ No DS ATP · High DRR <span class="atab-cnt red">'+noDsAll.length+'</span></div>'+'<div class="alert-tab" onclick="switchAlert(this,\'aNoSh-'+tab+'\')">❌ No SH ATP · High DRR <span class="atab-cnt red">'+noShAll.length+'</span></div>'+'<div class="alert-tab" onclick="switchAlert(this,\'aLDoh-'+tab+'\')">⚠️ DOH &lt;7d <span class="atab-cnt amber">'+lowDohAll.length+'</span></div>'+'<div class="alert-tab" onclick="switchAlert(this,\'aCrit-'+tab+'\')">🔴 Critical &lt;3d <span class="atab-cnt red">'+critAll.length+'</span></div>'+'<div class="alert-tab" onclick="switchAlert(this,\'aGsli-'+tab+'\')">📈 Good Sales, Low Stock <span class="atab-cnt teal">'+gsliAll.length+'</span></div>'+'</div>'+'<div class=\'alert-tab\' onclick=\'clearAlerts(this)\'>✕ None</div>'+apanel('aNoDs-'+tab,'DRR ≥30 + <span style="color:#dc2626">Zero DS ATP</span>',noDsTop,noDsAll.length,ALERT_COLS,'','NoDS_ATP')+apanel('aNoSh-'+tab,'DRR ≥30 + <span style="color:#7c3aed">Zero SH ATP</span>',noShTop,noShAll.length,ALERT_COLS,'','NoSH_ATP')+apanel('aLDoh-'+tab,'All FSNs with <span style="color:#d97706">DOH &lt;7 days</span>',lowDoh,lowDohAll.length,ALERT_COLS,'amber','Low_DOH')+apanel('aCrit-'+tab,'All FSNs with <span style="color:#dc2626">DOH &lt;3 days</span> — Critical',crit,critAll.length,ALERT_COLS,'','Critical_Stock')+apanel('aGsli-'+tab,'<span style="color:#059669">L30 Sales &gt;500</span> + <span style="color:#d97706">DOH &lt;14d</span>',gsli,gsliAll.length,GSLI_COLS,'teal','Good_Sales_Low_Stock')+'<script>document.getElementById("aNoDs-'+tab+'").classList.add("active");<\/script>'+'</div>';}
const MAIN_COLS=[
  {h:'FSN',k:'fsn',fn:r=>'<span class="fsn-cell">'+r.fsn+'</span>',sub:()=>'SUBTOTAL'},
  {h:'FSN | Store ID Combos',k:null,fn:r=>r.fsn+'|'+(r.store_ids&&r.store_ids[0]||'-'),sub:()=>''},
  {h:'Store IDs',k:null,fn:r=>r.store_ids&&r.store_ids.length?'<span class="store-ids-cell">'+r.store_ids.slice(0,5).join('<br>')+(r.store_count>5?'<br><i style="color:#94a3b8">+'+(r.store_count-5)+' more</i>':'')+'</span>':'—',sub:()=>''},
  {h:'Vertical',k:'vertical',fn:r=>r.vertical,sub:()=>''},
  {h:'Super Category',k:'supercat',fn:r=>'<span title="'+r.supercat+'">'+r.supercat.substring(0,16)+'</span>',sub:()=>''},
  {h:'Brand',k:'brand',fn:r=>'<b>'+r.brand+'</b>',sub:()=>''},
  {h:'ATP',k:'atp_avail',fn:r=>atpBadge(r.atp_avail),sub:()=>''},
  {h:'Flag',k:'flag',fn:r=>r.flag||'-',sub:()=>''},
  {h:'SH ATP',k:'sh_atp',fn:r=>'<span class="atp-sh">'+fmt(r.sh_atp)+'</span>',sub:rows=>fmt(rows.reduce((s,r)=>s+r.sh_atp,0))},
  {h:'DS ATP',k:'ds_atp',fn:r=>'<span class="atp-ds">'+fmt(r.ds_atp)+'</span>',sub:rows=>fmt(rows.reduce((s,r)=>s+r.ds_atp,0))},
  {h:'Total ATP',k:'total_atp',fn:r=>'<span class="atp-total">'+fmt(r.total_atp)+'</span>',sub:rows=>fmt(rows.reduce((s,r)=>s+r.total_atp,0))},
  {h:'L7 FK',k:'l7_fk',fn:r=>fmt(r.l7_fk),sub:rows=>fmt(rows.reduce((s,r)=>s+r.l7_fk,0))},
  {h:'L7 HL',k:'l7_hl',fn:r=>fmt(r.l7_hl),sub:rows=>fmt(rows.reduce((s,r)=>s+r.l7_hl,0))},
  {h:'L30 FK',k:'l30_fk',fn:r=>fmt(r.l30_fk),sub:rows=>fmt(rows.reduce((s,r)=>s+r.l30_fk,0))},
  {h:'L30 HL',k:'l30_hl',fn:r=>fmt(r.l30_hl),sub:rows=>fmt(rows.reduce((s,r)=>s+r.l30_hl,0))},
  {h:'DRR',k:'drr',fn:r=>drrCell(r.drr),sub:()=>''},
  {h:'DOH',k:'doh',fn:r=>dohCell(r.doh),sub:()=>''},
];
function buildTable(tab,data,s){
  var filtered=applyFilters(data,s.filters),sorted=sortData(filtered,s.sort,s.dir);
  var total=sorted.length,totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  var pg=Math.min(s.page,totalPages),slice=sorted.slice((pg-1)*PAGE_SIZE,pg*PAGE_SIZE);
  var thead='<thead><tr>'+MAIN_COLS.map(c=>{var a=s.sort===c.k,cls=a?(s.dir===-1?'sort-desc':'sort-asc'):'';return'<th class="'+cls+'"'+(c.k?' onclick="doSort(\''+tab+'\',\''+c.k+'\')">':'>') +c.h+'</th>';}).join('')+'</tr></thead>';
  var subtotalRow='<tr class="subtotal-row">'+MAIN_COLS.map(c=>'<td>'+c.sub(sorted)+'</td>').join('')+'</tr>';
  var tbody='<tbody>'+subtotalRow+slice.map(r=>'<tr>'+MAIN_COLS.map(c=>'<td>'+c.fn(r)+'</td>').join('')+'</tr>').join('')+'</tbody>';
  var pages=[];
  if(totalPages<=7){for(var i=1;i<=totalPages;i++)pages.push(i);}
  else{pages=[1];var lo=Math.max(2,pg-2),hi=Math.min(totalPages-1,pg+2);if(lo>2)pages.push('…');for(var i=lo;i<=hi;i++)pages.push(i);if(hi<totalPages-1)pages.push('…');pages.push(totalPages);}
  var pag='<div class="pagination">'+'<div class="pg-info">Showing '+((pg-1)*PAGE_SIZE+1).toLocaleString('en-IN')+'–'+Math.min(pg*PAGE_SIZE,total).toLocaleString('en-IN')+' of <b>'+total.toLocaleString('en-IN')+'</b> FSNs</div>'+'<div class="pg-btns">'+'<div class="pg-btn" onclick="goPage(\''+tab+'\','+(pg-1)+')">&#8249;</div>'+pages.map(p=>p==='…'?'<div class="pg-btn" style="cursor:default">…</div>':'<div class="pg-btn '+(p===pg?'active':'')+'"\'onclick="goPage(\''+tab+'\','+p+')">'+p+'</div>').join('')+'<div class="pg-btn" onclick="goPage(\''+tab+'\','+(pg+1)+')">&#8250;</div>'+'</div></div>';
  return'<div class="tbl-wrap"><table>'+thead+tbody+'</table></div>'+pag;}
function renderPanel(tab){
  var data=DATA[tab],el=document.getElementById('tab-'+tab);
  if(!data||!data.length){el.innerHTML='<div style="text-align:center;padding:50px;color:#64748b"><div style="font-size:40px;margin-bottom:12px">📂</div><div style="font-size:14px;color:#1e40af;font-weight:700">No data for this vertical.</div></div>';return;}
  var s=state[tab],stats=computeStats(data);
  var note=tab==='large'&&data.length>=5000?'<div class="info-bar">ℹ️ Large Appliances: showing top 5,000 FSNs by DRR.</div>':'';
  var cards='<div class="cards">'+'<div class="card"><div class="val">'+stats.t.toLocaleString('en-IN')+'</div><div class="lbl">Total FSNs</div></div>'+'<div class="card green"><div class="val">'+stats.both.toLocaleString('en-IN')+'</div><div class="lbl">DS + SH</div></div>'+'<div class="card teal"><div class="val">'+stats.dsOnly.toLocaleString('en-IN')+'</div><div class="lbl">DS Only</div></div>'+'<div class="card purple"><div class="val">'+stats.shOnly.toLocaleString('en-IN')+'</div><div class="lbl">SH Only</div></div>'+'<div class="card orange"><div class="val">'+stats.noAtp.toLocaleString('en-IN')+'</div><div class="lbl">No ATP</div></div>'+'<div class="card blue2"><div class="val">'+fmtK(stats.ds_atp_sum)+'</div><div class="lbl">Total DS ATP</div></div>'+'<div class="card indigo"><div class="val">'+fmtK(stats.sh_atp_sum)+'</div><div class="lbl">Total SH ATP</div></div>'+'<div class="card red"><div class="val">'+stats.noDsHighDrr.length+'</div><div class="lbl">High DRR · No DS</div></div>'+'<div class="card red"><div class="val">'+stats.noShHighDrr.length+'</div><div class="lbl">High DRR · No SH</div></div>'+'<div class="card orange"><div class="val">'+stats.lowDoh.length+'</div><div class="lbl">DOH &lt;7 Days</div></div>'+'<div class="card teal"><div class="val">'+stats.goodSalesLowInv.length+'</div><div class="lbl">Good Sales · Low Stock</div></div>'+'</div>';
  el.innerHTML=note+cards+buildAlerts(tab,stats)+buildFilters(tab,data,s.filters)+buildTable(tab,data,s);}
function renderOverview(){
  var tabs=['mobile','large','lifestyle','electronics'];
  var allStats={};tabs.forEach(t=>allStats[t]=computeStats(DATA[t]||[]));
  var buGrid='<div class="ov-grid">'+tabs.map(t=>{
    var s=allStats[t],m=TAB_META[t];
    return'<div class="ov-bu '+m.cls+'">'+'<div class="ov-bu-title">'+m.label+'</div>'+'<div class="ov-stat"><span class="k">Total FSNs</span><span class="v">'+s.t.toLocaleString('en-IN')+'</span></div>'+'<div class="ov-stat"><span class="k">DS + SH</span><span class="v green">'+s.both.toLocaleString('en-IN')+'</span></div>'+'<div class="ov-stat"><span class="k">DS Only</span><span class="v teal">'+s.dsOnly.toLocaleString('en-IN')+'</span></div>'+'<div class="ov-stat"><span class="k">SH Only</span><span class="v purple">'+s.shOnly.toLocaleString('en-IN')+'</span></div>'+'<div class="ov-stat"><span class="k">No ATP</span><span class="v orange">'+s.noAtp.toLocaleString('en-IN')+'</span></div>'+'<div class="ov-stat"><span class="k">Total DS ATP</span><span class="v blue">'+fmtK(s.ds_atp_sum)+'</span></div>'+'<div class="ov-stat"><span class="k">Total SH ATP</span><span class="v purple">'+fmtK(s.sh_atp_sum)+'</span></div>'+'<div class="ov-stat"><span class="k">No DS · High DRR</span><span class="v red">'+s.noDsHighDrr.length+'</span></div>'+'<div class="ov-stat"><span class="k">DOH &lt;7 Days</span><span class="v orange">'+s.lowDoh.length+'</span></div>'+'<div class="ov-stat"><span class="k">Good Sales, Low Stock</span><span class="v teal">'+s.goodSalesLowInv.length+'</span></div>'+'</div>';}).join('')+'</div>';
  var chartHtml='<div class="chart-section">'+'<div class="chart-section-title">📊 ATP Coverage by Vertical — All BUs</div>'+'<div class="chart-2col">'+'<div><div style="font-size:10.5px;font-weight:700;color:#64748b;margin-bottom:6px">Stacked Coverage (FSN Count)</div><div class="chart-inner"><canvas id="chart-ov-stacked"></canvas></div></div>'+'<div><div style="font-size:10.5px;font-weight:700;color:#64748b;margin-bottom:6px">Critical Alerts Comparison</div><div class="chart-inner"><canvas id="chart-ov-alerts"></canvas></div></div>'+'</div></div>';
  document.getElementById('tab-overview').innerHTML=buGrid+chartHtml;
  setTimeout(function(){initOverviewCharts(tabs,allStats);},80);}
function initOverviewCharts(tabs,allStats){
  ['chart-ov-stacked','chart-ov-alerts'].forEach(id=>{if(charts[id]){charts[id].destroy();delete charts[id];}});
  var labels=tabs.map(t=>TAB_META[t].label.replace(/^.+ /,''));
  var sel=document.getElementById('chart-ov-stacked');
  if(sel&&typeof Chart!=='undefined'){
    charts['chart-ov-stacked']=new Chart(sel,{type:'bar',data:{labels,datasets:[{label:'DS+SH',data:tabs.map(t=>allStats[t].both),backgroundColor:'#10b981',borderRadius:2},{label:'DS Only',data:tabs.map(t=>allStats[t].dsOnly),backgroundColor:'#3b82f6',borderRadius:2},{label:'SH Only',data:tabs.map(t=>allStats[t].shOnly),backgroundColor:'#8b5cf6',borderRadius:2},{label:'No ATP',data:tabs.map(t=>allStats[t].noAtp),backgroundColor:'#ef4444',borderRadius:2},]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:10},boxWidth:10,padding:8}}},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:10}}},y:{stacked:true,grid:{color:'#f1f5f9'},ticks:{font:{size:10}}}}}});}
  var ael=document.getElementById('chart-ov-alerts');
  if(ael&&typeof Chart!=='undefined'){
    charts['chart-ov-alerts']=new Chart(ael,{type:'bar',data:{labels,datasets:[{label:'No DS ATP',data:tabs.map(t=>allStats[t].noDsHighDrr.length),backgroundColor:'#dc2626',borderRadius:2},{label:'No SH ATP',data:tabs.map(t=>allStats[t].noShHighDrr.length),backgroundColor:'#8b5cf6',borderRadius:2},{label:'DOH <7d',data:tabs.map(t=>allStats[t].lowDoh.length),backgroundColor:'#f59e0b',borderRadius:2},{label:'Critical <3d',data:tabs.map(t=>allStats[t].critStock.length),backgroundColor:'#ef4444',borderRadius:2},]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:10},boxWidth:10,padding:8}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:'#f1f5f9'},ticks:{font:{size:10}}}}}});}}
function switchTab(tab,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));el.classList.add('active');document.getElementById('tab-'+tab).classList.add('active');if(tab==='overview')renderOverview();else renderPanel(tab);}
function clearAlerts(el){var p=el.closest('.alerts');p.querySelectorAll('.alert-tab').forEach(t=>t.classList.remove('active'));p.querySelectorAll('.alert-panel').forEach(p=>p.classList.remove('active'));el.classList.add('active');}
function switchAlert(el,id){var p=el.closest('.alerts');p.querySelectorAll('.alert-tab').forEach(t=>t.classList.remove('active'));p.querySelectorAll('.alert-panel').forEach(p=>p.classList.remove('active'));el.classList.add('active');document.getElementById(id).classList.add('active');}
function goPage(tab,pg){var data=DATA[tab],filtered=applyFilters(data,state[tab].filters);var total=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));state[tab].page=Math.max(1,Math.min(pg,total));renderPanel(tab);}
function doSort(tab,col){if(state[tab].sort===col)state[tab].dir*=-1;else{state[tab].sort=col;state[tab].dir=-1;}state[tab].page=1;renderPanel(tab);}
renderPanel('mobile');
</script></body></html>
